services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: loanflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loanflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loanflow_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-loanflow_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loanflow} -d ${POSTGRES_DB:-loanflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
